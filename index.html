<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hanabirn の 小天地</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sakura-container" aria-hidden="true">
        <div class="sakura s1"></div><div class="sakura s2"></div><div class="sakura s3"></div>
        <div class="sakura s4"></div><div class="sakura s5"></div><div class="sakura s6"></div>
        <div class="sakura s7"></div><div class="sakura s8"></div><div class="sakura s9"></div>
        <div class="sakura s10"></div><div class="sakura s11"></div><div class="sakura s12"></div>
        <div class="sakura s13"></div><div class="sakura s14"></div><div class="sakura s15"></div>
    </div>

    <div class="stars-bg">
        <div class="star" style="--x:10%;--y:15%;--delay:0s;--size:3px"></div>
        <div class="star" style="--x:25%;--y:8%;--delay:1.2s;--size:2px"></div>
        <div class="star" style="--x:45%;--y:20%;--delay:0.5s;--size:4px"></div>
        <div class="star" style="--x:65%;--y:5%;--delay:2s;--size:2px"></div>
        <div class="star" style="--x:80%;--y:18%;--delay:0.8s;--size:3px"></div>
        <div class="star" style="--x:90%;--y:12%;--delay:1.5s;--size:2px"></div>
        <div class="star" style="--x:15%;--y:45%;--delay:2.5s;--size:2px"></div>
        <div class="star" style="--x:35%;--y:55%;--delay:0.3s;--size:3px"></div>
        <div class="star" style="--x:55%;--y:40%;--delay:1.8s;--size:2px"></div>
        <div class="star" style="--x:75%;--y:50%;--delay:0.7s;--size:4px"></div>
        <div class="star" style="--x:5%;--y:70%;--delay:1s;--size:2px"></div>
        <div class="star" style="--x:50%;--y:75%;--delay:2.2s;--size:3px"></div>
        <div class="star" style="--x:85%;--y:65%;--delay:0.4s;--size:2px"></div>
        <div class="star" style="--x:20%;--y:85%;--delay:1.7s;--size:3px"></div>
        <div class="star" style="--x:60%;--y:90%;--delay:2.8s;--size:2px"></div>
    </div>

    <div class="deco-img deco-miku1"><img src="images/miku1.png" alt=""></div>
    <div class="deco-img deco-miku2"><img src="images/miku2.png" alt=""></div>
    <div class="deco-img deco-anime1"><img src="images/anime1.jpg" alt=""></div>
    <div class="deco-img deco-anime2"><img src="images/anime2.jpg" alt=""></div>
    <div class="deco-img deco-gif1"><img src="images/gif1.gif" alt=""></div>
    <div class="deco-img deco-gif2"><img src="images/gif2.gif" alt=""></div>

    <header>
        <div class="header-wave"></div>
        <div class="header-sakura left">&#x273F;</div>
        <div class="header-sakura right">&#x273F;</div>
        <h1>hanabirn の 小天地</h1>
        <p class="subtitle">學習是一件快樂的事</p>
        <nav class="main-nav">
            <button class="nav-btn active" onclick="switchPage('quiz')">單字測驗</button>
            <button class="nav-btn" onclick="switchPage('music')">音樂收藏</button>
            <button class="nav-btn" onclick="switchPage('osu')">osu! 收藏</button>
        </nav>
    </header>

    <main>
        <div id="page-quiz">
            <div class="lang-card" id="lang-card">
                <div class="card-corner tl"></div><div class="card-corner tr"></div>
                <div class="card-corner bl"></div><div class="card-corner br"></div>
                <h3>&#x2726; 選擇語言 &#x2726;</h3>
                <div class="lang-buttons">
                    <button class="lang-btn jp" onclick="selectLanguage('jp')">
                        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/9/9e/Flag_of_Japan.svg/1280px-Flag_of_Japan.svg.png" alt="日本國旗" class="lang-flag">
                        <span>日文單字測驗</span>
                    </button>
                    <button class="lang-btn kr" onclick="selectLanguage('kr')">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Flag_of_South_Korea.svg/3840px-Flag_of_South_Korea.svg.png" alt="韓國國旗" class="lang-flag">
                        <span>韓文單字測驗</span>
                    </button>
                </div>
            </div>

            <div class="setup-card" id="setup-card" style="display: none;">
                <div class="card-corner tl"></div><div class="card-corner tr"></div>
                <div class="card-corner bl"></div><div class="card-corner br"></div>
                <h3>綁定 Google 試算表</h3>
                <div class="input-group">
                    <input type="text" id="sheetUrlInput" placeholder="貼上 Google Sheet 網址">
                    <button onclick="loadSheetData(document.getElementById('sheetUrlInput').value.trim())">載入單字庫</button>
                </div>
                <p id="status-msg" class="status"></p>
            </div>

            <div class="mode-card" id="mode-card" style="display: none;">
                <div class="card-corner tl"></div><div class="card-corner tr"></div>
                <div class="card-corner bl"></div><div class="card-corner br"></div>
                <h3>選擇測驗模式</h3>
                <div class="mode-buttons" id="mode-buttons"></div>
            </div>

            <div id="quiz-card" class="quiz-card" style="display: none;">
                <div class="card-corner tl"></div><div class="card-corner tr"></div>
                <div class="card-corner bl"></div><div class="card-corner br"></div>
                <div class="quiz-header">
                    <span id="question-count">第 0 題</span>
                    <span id="quiz-mode-label"></span>
                    <span id="total-words">有效單字: 0</span>
                    <span id="score-count">得分: 0</span>
                </div>

                <div class="question-box">
                    <div class="question-deco">&#x2726;</div>
                    <h2 id="word-question">—</h2>
                    <p id="word-hint" class="hint"></p>
                </div>

                <div class="options-divider"></div>
                <div id="options-container" class="options-container"></div>

                <div id="feedback" class="feedback"></div>

                <div class="action-buttons">
                    <button id="nextBtn" class="btn next-btn" onclick="nextQuestion()" style="display: none;">次の問題 &#x2192;</button>
                    <button class="btn back-btn" onclick="backToLanguage()">&#x2190; 返回選擇語言</button>
                </div>
            </div>
        </div>

        <div id="page-music" style="display: none;">
            <div class="music-tabs">
                <button class="music-tab active" onclick="switchMusicTab('all', this)">&#x266B; 所有歌曲</button>
                <button class="music-tab" onclick="switchMusicTab('cn', this)">&#x266B; 中文 / 粵語歌</button>
            </div>
            <div class="music-player">
                <iframe id="music-iframe" src="https://open.spotify.com/embed/playlist/0QFBFg35lFuDvuYapAolHC?utm_source=generator&theme=0" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>
        </div>
        <div id="page-osu" style="display: none;">
            <div class="osu-add-card">
                <div class="card-corner tl"></div><div class="card-corner tr"></div>
                <div class="card-corner bl"></div><div class="card-corner br"></div>
                <h3>&#x266B; 新增 Beatmap &#x266B;</h3>
                <div class="input-group">
                    <input type="text" id="osuInput" placeholder="輸入 ID 或貼上 osu! 網址" onkeydown="if(event.key==='Enter')addOsuBeatmap()">
                    <button onclick="addOsuBeatmap()">新增</button>
                </div>
                <p id="osu-status" class="status"></p>
            </div>

            <div class="osu-mode-tabs">
                <button class="osu-tab" onclick="switchOsuTab('favorites', this)">♥ 最愛</button>
                <button class="osu-tab active" onclick="switchOsuTab('standard', this)">Standard</button>
                <button class="osu-tab" onclick="switchOsuTab('taiko', this)">Taiko</button>
                <button class="osu-tab" onclick="switchOsuTab('catch', this)">Catch</button>
                <button class="osu-tab" onclick="switchOsuTab('mania', this)">Mania</button>
            </div>

            <div id="osu-collection" class="osu-collection"></div>
        </div>
    </main>

    <footer>
        <div class="footer-sakura">&#x273F;</div>
        <p>2026 hanabirn の 小天地</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <script>
        const PLAYLISTS = {
            all: '0QFBFg35lFuDvuYapAolHC',
            cn: '5XQgwQcuRRBcyVaKMQbB88'
        };

        function switchPage(page) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('page-quiz').style.display = page === 'quiz' ? 'block' : 'none';
            document.getElementById('page-music').style.display = page === 'music' ? 'block' : 'none';
            document.getElementById('page-osu').style.display = page === 'osu' ? 'block' : 'none';
            if (page === 'osu') renderOsuCollection();
        }

        function switchMusicTab(lang, btn) {
            document.querySelectorAll('.music-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('music-iframe').src = `https://open.spotify.com/embed/playlist/${PLAYLISTS[lang]}?utm_source=generator&theme=0`;
        }

        const SHEETS = {
            jp: 'https://docs.google.com/spreadsheets/d/134jLu-WAoCx7VK7aTsnEYbWJPQPA56Su2Vsez3jFRPw/export?format=csv&gid=0',
            kr: 'https://docs.google.com/spreadsheets/d/1BsO7tpzFgO39AyBo2SV1RZFDWfPECB-LzWBGA87nbQA/export?format=csv&gid=0'
        };

        let currentLang = '';
        let vocabularyList = [];
        let readingList = [];
        let currentWord = null;
        let currentMode = 'meaning';
        let score = 0;
        let questionNum = 0;
        let answered = false;

        function extractSheetId(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : url;
        }

        function isValidWord(word, meaning) {
            if (!word || !meaning) return false;
            const w = word.trim();
            const m = meaning.trim();
            if (w.includes('動畫') || w.includes('動画') || w.includes('동영상') || w.includes('註') || w.includes('★') || w.includes('單字')) return false;
            if (m.includes('動畫') || m.includes('動画') || m.includes('意思') || m.includes('註')) return false;
            if (/^\d+$/.test(w)) return false;
            if (w.length === 0 || m.length === 0) return false;
            return true;
        }

        function selectLanguage(lang) {
            currentLang = lang;
            document.getElementById('lang-card').style.display = 'none';
            document.getElementById('sheetUrlInput').value = SHEETS[lang];
            loadSheetData(SHEETS[lang]);
        }

        function loadSheetData(url) {
            const statusMsg = document.getElementById('status-msg');
            const setupCard = document.getElementById('setup-card');
            setupCard.style.display = 'block';

            const sheetId = extractSheetId(url);
            if (!sheetId) {
                alert('請輸入正確的 Google Sheet 網址！');
                return;
            }

            statusMsg.innerText = '正在讀取 Google 試算表單字庫...';
            statusMsg.style.color = '#c8a2e0';

            const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=0`;

            Papa.parse(csvUrl, {
                download: true,
                header: false,
                complete: function(results) {
                    const rows = results.data;
                    vocabularyList = [];
                    readingList = [];

                    if (currentLang === 'jp') {
                        parseJapanese(rows);
                    } else {
                        parseKorean(rows);
                    }

                    if (vocabularyList.length >= 4) {
                        statusMsg.innerText = `成功讀取 ${vocabularyList.length} 個有效單字${readingList.length > 0 ? '（含讀法: ' + readingList.length + ' 個）' : ''}`;
                        statusMsg.style.color = '#f472b6';
                        showModeSelection();
                    } else {
                        statusMsg.innerText = `讀取到的單字不足（僅 ${vocabularyList.length} 個），無法出題！`;
                        statusMsg.style.color = '#ff5252';
                    }
                },
                error: function() {
                    statusMsg.innerText = '讀取失敗，請確認試算表共用權限！';
                    statusMsg.style.color = '#ff5252';
                }
            });
        }

        function parseJapanese(rows) {
            rows.forEach((row) => {
                if (row.length < 5) return;
                addWord(row[2], row[3], row[4]);
                if (row.length > 9)  addWord(row[7], row[8], row[9]);
                if (row.length > 14) addWord(row[12], row[13], row[14]);
                if (row.length > 19) addWord(row[17], row[18], row[19]);
            });
        }

        function parseKorean(rows) {
            rows.forEach((row) => {
                if (row.length < 4) return;
                addWord(row[2], '', row[3]);
                if (row.length > 6)  addWord(row[6], '', row[7]);
                if (row.length > 10) addWord(row[10], '', row[11]);
                if (row.length > 14) addWord(row[14], '', row[15]);
                if (row.length > 18) addWord(row[18], '', row[19]);
            });
        }

        function addWord(word, kana, meaning) {
            const w = word.trim();
            const k = kana ? kana.trim() : '';
            const m = meaning.trim();
            if (!isValidWord(w, m)) return;
            vocabularyList.push({ word: w, kana: k, meaning: m });
            if (k.length > 0) {
                readingList.push({ word: w, kana: k, meaning: m });
            }
        }

        function showModeSelection() {
            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('mode-card').style.display = 'block';
            document.getElementById('quiz-card').style.display = 'none';

            const container = document.getElementById('mode-buttons');
            container.innerHTML = '';

            const btnMeaning = document.createElement('button');
            btnMeaning.className = 'mode-btn';
            btnMeaning.innerText = currentLang === 'jp' ? '日文 → 選中文意思' : '韓文 → 選中文意思';
            btnMeaning.onclick = () => startQuiz('meaning');
            container.appendChild(btnMeaning);

            if (readingList.length >= 4) {
                const btnReading = document.createElement('button');
                btnReading.className = 'mode-btn';
                btnReading.innerText = '日文 → 選讀法';
                btnReading.onclick = () => startQuiz('reading');
                container.appendChild(btnReading);

                const btnBoth = document.createElement('button');
                btnBoth.className = 'mode-btn';
                btnBoth.innerText = '混合隨機';
                btnBoth.onclick = () => startQuiz('both');
                container.appendChild(btnBoth);
            }
        }

        function startQuiz(mode) {
            currentMode = mode;
            score = 0;
            questionNum = 0;

            document.getElementById('mode-card').style.display = 'none';
            document.getElementById('quiz-card').style.display = 'block';

            const modeNames = { meaning: '考意思', reading: '考讀法', both: '混合' };
            document.getElementById('quiz-mode-label').innerText = modeNames[mode];
            document.getElementById('total-words').innerText = `有效單字: ${vocabularyList.length}`;
            nextQuestion();
        }

        function pickQuestionType() {
            if (currentMode === 'meaning') return 'meaning';
            if (currentMode === 'reading') return 'reading';
            return Math.random() < 0.5 ? 'meaning' : 'reading';
        }

        function nextQuestion() {
            answered = false;
            questionNum++;
            document.getElementById('question-count').innerText = `第 ${questionNum} 題`;
            document.getElementById('score-count').innerText = `得分: ${score}`;
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('feedback').innerText = '';
            document.getElementById('feedback').className = 'feedback';

            const questionType = pickQuestionType();

            if (questionType === 'reading' && readingList.length >= 4) {
                const pool = readingList;
                currentWord = pool[Math.floor(Math.random() * pool.length)];

                document.getElementById('word-question').innerText = currentWord.word;
                document.getElementById('word-hint').innerText = `意思：${currentWord.meaning}`;

                let options = [currentWord.kana];
                while (options.length < 4) {
                    const pick = pool[Math.floor(Math.random() * pool.length)].kana;
                    if (!options.includes(pick)) options.push(pick);
                }
                options.sort(() => Math.random() - 0.5);
                renderOptions(options, 'reading');
            } else {
                currentWord = vocabularyList[Math.floor(Math.random() * vocabularyList.length)];

                document.getElementById('word-question').innerText = currentWord.word;
                document.getElementById('word-hint').innerText = currentWord.kana ? `讀法：${currentWord.kana}` : '';

                let options = [currentWord.meaning];
                while (options.length < 4) {
                    const pick = vocabularyList[Math.floor(Math.random() * vocabularyList.length)].meaning;
                    if (!options.includes(pick)) options.push(pick);
                }
                options.sort(() => Math.random() - 0.5);
                renderOptions(options, 'meaning');
            }
        }

        function renderOptions(options, type) {
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            options.forEach((optText) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.onclick = () => selectOption(btn, optText, type);
                container.appendChild(btn);
            });
        }

        function selectOption(selectedBtn, selectedText, type) {
            if (answered) return;
            answered = true;

            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.disabled = true);

            const feedback = document.getElementById('feedback');
            const correctAnswer = type === 'reading' ? currentWord.kana : currentWord.meaning;

            if (selectedText === correctAnswer) {
                score += 10;
                selectedBtn.classList.add('correct-choice');
                feedback.innerText = '正解！';
                feedback.className = 'feedback correct';
            } else {
                selectedBtn.classList.add('wrong-choice');
                allBtns.forEach(btn => {
                    if (btn.innerText === correctAnswer) {
                        btn.classList.add('correct-choice');
                    }
                });
                feedback.innerText = `不正解... 正確答案は：${correctAnswer}`;
                feedback.className = 'feedback wrong';
            }

            document.getElementById('score-count').innerText = `得分: ${score}`;
            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function backToLanguage() {
            currentLang = '';
            vocabularyList = [];
            readingList = [];
            document.getElementById('lang-card').style.display = 'block';
            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('mode-card').style.display = 'none';
            document.getElementById('quiz-card').style.display = 'none';
        }

        /* ===== osu! Collection ===== */
        const OSU_API_KEY = 'db6c7c60d8b9754364b2a8e225441f0f6f379452';
        const OSU_MODES = ['standard', 'taiko', 'catch', 'mania'];
        const OSU_MODE_NAMES = { 0: 'standard', 1: 'taiko', 2: 'catch', 3: 'mania' };
        let osuCurrentTab = 'standard';

        function getOsuFavorites() {
            try { return JSON.parse(localStorage.getItem('osu_favorites')) || []; }
            catch { return []; }
        }

        function saveOsuFavorites(favs) {
            localStorage.setItem('osu_favorites', JSON.stringify(favs));
        }

        function isOsuFavorited(setId) {
            return getOsuFavorites().includes(setId);
        }

        function toggleOsuFavorite(setId, event) {
            event.stopPropagation();
            const favs = getOsuFavorites();
            const idx = favs.indexOf(setId);
            if (idx >= 0) favs.splice(idx, 1);
            else favs.push(setId);
            saveOsuFavorites(favs);
            renderOsuCollection();
        }

        function getOsuCollection() {
            try {
                return JSON.parse(localStorage.getItem('osu_collection')) || { standard: [], taiko: [], catch: [], mania: [] };
            } catch { return { standard: [], taiko: [], catch: [], mania: [] }; }
        }

        function saveOsuCollection(col) {
            localStorage.setItem('osu_collection', JSON.stringify(col));
        }

        function parseOsuInput(input) {
            const urlMatch = input.match(/osu\.ppy\.sh\/(?:beatmaps?|beatmapsets?)\/(\d+)/);
            if (urlMatch) return { type: 'url', id: urlMatch[1], isSet: input.includes('beatmapsets') };
            if (/^\d+$/.test(input.trim())) return { type: 'id', id: input.trim(), isSet: false };
            return null;
        }

        async function osuFetch(params) {
            const res = await fetch(`/.netlify/functions/osu?${params}`);
            const text = await res.text();
            try { return JSON.parse(text); }
            catch { throw new Error(`Function 回傳非 JSON (HTTP ${res.status}): ${text.substring(0, 200)}`); }
        }

        async function addOsuBeatmap() {
            const input = document.getElementById('osuInput');
            const status = document.getElementById('osu-status');
            const raw = input.value.trim();
            if (!raw) return;

            const parsed = parseOsuInput(raw);
            if (!parsed) {
                status.innerText = '請輸入 Beatmap ID、Set ID 或 osu! 網址';
                status.style.color = '#ff5252';
                return;
            }

            status.innerText = '搜尋中...';
            status.style.color = '#c8a2e0';

            try {
                let beatmaps = [];

                if (parsed.isSet || parsed.type === 'url' && input.value.includes('beatmapsets')) {
                    beatmaps = await osuFetch(`s=${parsed.id}`);
                }

                if (beatmaps.length === 0) {
                    const byMap = await osuFetch(`b=${parsed.id}`);
                    if (byMap.length > 0) {
                        beatmaps = await osuFetch(`s=${byMap[0].beatmapset_id}`);
                    }
                }

                if (beatmaps.length === 0 && !parsed.isSet) {
                    beatmaps = await osuFetch(`s=${parsed.id}`);
                }

                if (beatmaps.length === 0) {
                    status.innerText = '找不到該 Beatmap，請確認 ID 或網址是否正確';
                    status.style.color = '#ff5252';
                    return;
                }

                const modeNum = parseInt(beatmaps[0].mode);
                const modeKey = OSU_MODE_NAMES[modeNum];
                const col = getOsuCollection();

                const alreadyExists = col[modeKey].some(s => s.beatmapset_id === parseInt(beatmaps[0].beatmapset_id));
                if (alreadyExists) {
                    status.innerText = `「${beatmaps[0].artist} - ${beatmaps[0].title}」已在收藏庫中`;
                    status.style.color = '#f59e0b';
                    return;
                }

                const setInfo = {
                    beatmapset_id: parseInt(beatmaps[0].beatmapset_id),
                    title: beatmaps[0].title,
                    artist: beatmaps[0].artist,
                    creator: beatmaps[0].creator,
                    mode: modeNum,
                    beatmaps: beatmaps.map(b => ({
                        beatmap_id: parseInt(b.beatmap_id),
                        version: b.version,
                        difficulty_rating: parseFloat(b.difficultyrating),
                        hit_length: parseInt(b.hit_length),
                        total_length: parseInt(b.total_length),
                        bpm: parseFloat(b.bpm)
                    })).sort((a, b) => a.difficulty_rating - b.difficulty_rating)
                };

                col[modeKey].unshift(setInfo);
                saveOsuCollection(col);

                const modeNames = { standard: 'Standard', taiko: 'Taiko', catch: 'Catch', mania: 'Mania' };
                status.innerText = `已新增「${setInfo.artist} - ${setInfo.title}」至 ${modeNames[modeKey]}（${setInfo.beatmaps.length} 個難度）`;
                status.style.color = '#34d399';
                input.value = '';

                osuCurrentTab = modeKey;
                document.querySelectorAll('.osu-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.osu-tab')[modeNum + 1].classList.add('active');
                renderOsuCollection();
            } catch (e) {
                console.error('osu! fetch error:', e);
                status.innerText = `連線失敗: ${e.message}`;
                status.style.color = '#ff5252';
            }
        }

        function switchOsuTab(mode, btn) {
            document.querySelectorAll('.osu-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            osuCurrentTab = mode;
            renderOsuCollection();
        }

        function removeOsuSet(setId) {
            const col = getOsuCollection();
            col[osuCurrentTab] = col[osuCurrentTab].filter(s => s.beatmapset_id !== setId);
            saveOsuCollection(col);
            renderOsuCollection();
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function renderOsuCollection() {
            const container = document.getElementById('osu-collection');
            const col = getOsuCollection();
            let sets;

            if (osuCurrentTab === 'favorites') {
                const favIds = getOsuFavorites();
                const allSets = [...col.standard, ...col.taiko, ...col.catch, ...col.mania];
                const seen = new Set();
                sets = allSets.filter(s => {
                    if (favIds.includes(s.beatmapset_id) && !seen.has(s.beatmapset_id)) {
                        seen.add(s.beatmapset_id);
                        return true;
                    }
                    return false;
                });
            } else {
                const seen = new Set();
                sets = col[osuCurrentTab].filter(s => {
                    if (seen.has(s.beatmapset_id)) return false;
                    seen.add(s.beatmapset_id);
                    return true;
                });
            }

            if (sets.length === 0) {
                const msg = osuCurrentTab === 'favorites'
                    ? '還沒有最愛的歌曲<br><span>在其他分類中點擊 ♥ 加入最愛！</span>'
                    : '還沒有收藏的 Beatmap<br><span>在上方輸入 Beatmap ID 開始收藏！</span>';
                container.innerHTML = `<div class="osu-empty">${msg}</div>`;
                return;
            }

            container.innerHTML = sets.map(set => {
                const coverUrl = `https://assets.ppy.sh/beatmaps/${set.beatmapset_id}/covers/card.jpg`;
                const isFav = isOsuFavorited(set.beatmapset_id);
                return `
                <div class="osu-card" onclick="window.open('https://osu.ppy.sh/beatmapsets/${set.beatmapset_id}','_blank')">
                    <div class="osu-card-bg" style="background-image:url('${coverUrl}')"></div>
                    <div class="osu-card-overlay"></div>
                    <button class="osu-fav-btn ${isFav ? 'active' : ''}" onclick="toggleOsuFavorite(${set.beatmapset_id}, event)" title="${isFav ? '取消最愛' : '加入最愛'}">♥</button>
                    <button class="osu-delete-btn" onclick="event.stopPropagation();removeOsuSet(${set.beatmapset_id})" title="移除">&#x2715;</button>
                    <div class="osu-card-info">
                        <div class="osu-card-title">${set.title}</div>
                        <div class="osu-card-artist">${set.artist}</div>
                        <div class="osu-card-mapper">mapped by ${set.creator}</div>
                    </div>
                </div>`;
            }).join('');
        }
    </script>
</body>
</html>
