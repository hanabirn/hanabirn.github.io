<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hanabirn の 小天地</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sakura-container" aria-hidden="true">
        <div class="sakura s1"></div><div class="sakura s2"></div><div class="sakura s3"></div>
        <div class="sakura s4"></div><div class="sakura s5"></div><div class="sakura s6"></div>
        <div class="sakura s7"></div><div class="sakura s8"></div><div class="sakura s9"></div>
        <div class="sakura s10"></div><div class="sakura s11"></div><div class="sakura s12"></div>
        <div class="sakura s13"></div><div class="sakura s14"></div><div class="sakura s15"></div>
    </div>

    <div class="stars-bg">
        <div class="star" style="--x:10%;--y:15%;--delay:0s;--size:3px"></div>
        <div class="star" style="--x:25%;--y:8%;--delay:1.2s;--size:2px"></div>
        <div class="star" style="--x:45%;--y:20%;--delay:0.5s;--size:4px"></div>
        <div class="star" style="--x:65%;--y:5%;--delay:2s;--size:2px"></div>
        <div class="star" style="--x:80%;--y:18%;--delay:0.8s;--size:3px"></div>
        <div class="star" style="--x:90%;--y:12%;--delay:1.5s;--size:2px"></div>
        <div class="star" style="--x:15%;--y:45%;--delay:2.5s;--size:2px"></div>
        <div class="star" style="--x:35%;--y:55%;--delay:0.3s;--size:3px"></div>
        <div class="star" style="--x:55%;--y:40%;--delay:1.8s;--size:2px"></div>
        <div class="star" style="--x:75%;--y:50%;--delay:0.7s;--size:4px"></div>
        <div class="star" style="--x:5%;--y:70%;--delay:1s;--size:2px"></div>
        <div class="star" style="--x:50%;--y:75%;--delay:2.2s;--size:3px"></div>
        <div class="star" style="--x:85%;--y:65%;--delay:0.4s;--size:2px"></div>
        <div class="star" style="--x:20%;--y:85%;--delay:1.7s;--size:3px"></div>
        <div class="star" style="--x:60%;--y:90%;--delay:2.8s;--size:2px"></div>
    </div>

    <div class="deco-img" style="display:none"></div>

    <header>
        <div class="header-wave"></div>
        <div class="header-sakura left">&#x273F;</div>
        <div class="header-sakura right">&#x273F;</div>
        <div class="lang-switcher">
            <button class="lang-switch-btn" onclick="toggleLangMenu()" id="lang-switch-label">🌐 中文</button>
            <div class="lang-switch-menu" id="lang-switch-menu">
                <button onclick="setSiteLang('zh')">🇹🇼 中文</button>
                <button onclick="setSiteLang('en')">🇬🇧 English</button>
                <button onclick="setSiteLang('ja')">🇯🇵 日本語</button>
                <button onclick="setSiteLang('ko')">🇰🇷 한국어</button>
                <button onclick="setSiteLang('ru')">🇷🇺 Русский</button>
                <button onclick="setSiteLang('fr')">🇫🇷 Français</button>
                <button onclick="setSiteLang('es')">🇪🇸 Español</button>
                <button onclick="setSiteLang('de')">🇩🇪 Deutsch</button>
            </div>
        </div>
        <h1 data-i18n="title">hanabirn の 小天地</h1>
        <p class="subtitle" data-i18n="subtitle">學習是一件快樂的事</p>
        <nav class="main-nav">
            <button class="nav-btn active" onclick="switchPage('quiz', this)" data-i18n="nav_quiz">單字測驗</button>
            <button class="nav-btn" onclick="switchPage('music', this)" data-i18n="nav_music">音樂收藏</button>
            <button class="nav-btn" onclick="switchPage('osu', this)" data-i18n="nav_osu">osu! 收藏</button>
        </nav>
    </header>

    <main>
        <div id="page-quiz">
            <div class="lang-card" id="lang-card">
                <div class="card-corner tl"></div><div class="card-corner tr"></div>
                <div class="card-corner bl"></div><div class="card-corner br"></div>
                <h3 data-i18n="select_lang">&#x2726; 選擇語言 &#x2726;</h3>
                <div class="lang-buttons">
                    <button class="lang-btn jp" onclick="selectLanguage('jp')">
                        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/9/9e/Flag_of_Japan.svg/1280px-Flag_of_Japan.svg.png" alt="日本國旗" class="lang-flag">
                        <span data-i18n="quiz_jp">日文單字測驗</span>
                    </button>
                    <button class="lang-btn kr" onclick="selectLanguage('kr')">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Flag_of_South_Korea.svg/3840px-Flag_of_South_Korea.svg.png" alt="韓國國旗" class="lang-flag">
                        <span data-i18n="quiz_kr">韓文單字測驗</span>
                    </button>
                </div>
            </div>

            <div class="setup-card" id="setup-card" style="display: none;">
                <div class="card-corner tl"></div><div class="card-corner tr"></div>
                <div class="card-corner bl"></div><div class="card-corner br"></div>
                <h3 data-i18n="setup_title">綁定 Google 試算表</h3>
                <div class="input-group">
                    <input type="text" id="sheetUrlInput" data-i18n-placeholder="setup_placeholder" placeholder="貼上 Google Sheet 網址">
                    <button onclick="loadSheetData(document.getElementById('sheetUrlInput').value.trim())" data-i18n="setup_load">載入單字庫</button>
                </div>
                <p id="status-msg" class="status"></p>
            </div>

            <div class="mode-card" id="mode-card" style="display: none;">
                <div class="card-corner tl"></div><div class="card-corner tr"></div>
                <div class="card-corner bl"></div><div class="card-corner br"></div>
                <h3 data-i18n="mode_title">選擇測驗模式</h3>
                <div class="mode-buttons" id="mode-buttons"></div>
                <h3 data-i18n="answer_lang_title" id="answer-lang-title" style="display:none">選擇答案語言</h3>
                <div class="mode-buttons" id="answer-lang-buttons" style="display:none"></div>
                <h3 data-i18n="quiz_count_title" id="quiz-count-title">選擇題數</h3>
                <div class="mode-buttons" id="quiz-count-buttons"></div>
            </div>

            <div id="quiz-card" class="quiz-card" style="display: none;">
                <div class="card-corner tl"></div><div class="card-corner tr"></div>
                <div class="card-corner bl"></div><div class="card-corner br"></div>
                <div class="quiz-header">
                    <span id="question-count" data-i18n="quiz_question">第 0 題</span>
                    <span id="quiz-mode-label"></span>
                    <span id="total-words" data-i18n="quiz_words">有效單字: 0</span>
                    <span id="score-count" data-i18n="quiz_score">得分: 0</span>
                    <button id="autoSpeakBtn" class="auto-speak-btn speak-active" onclick="toggleAutoSpeak()" title="自動播放發音">&#x1f50a; 語音</button>
                </div>

                <div class="question-box">
                    <div class="question-deco">&#x2726;</div>
                    <div class="question-row">
                        <h2 id="word-question">—</h2>
                        <button id="speakBtn" class="speak-btn" onclick="speakWord()" title="播放發音">&#x1f50a;</button>
                    </div>
                    <p id="word-hint" class="hint"></p>
                </div>

                <div class="options-divider"></div>
                <div id="options-container" class="options-container"></div>

                <div id="feedback" class="feedback"></div>

                <div class="action-buttons">
                    <button id="nextBtn" class="btn next-btn" onclick="nextQuestion()" style="display: none;" data-i18n="quiz_next">次の問題 &#x2192;</button>
                    <button class="btn back-btn" onclick="backToLanguage()" data-i18n="quiz_back">&#x2190; 返回選擇語言</button>
                </div>
            </div>

            <div id="result-card" class="quiz-card" style="display: none;">
                <div class="card-corner tl"></div><div class="card-corner tr"></div>
                <div class="card-corner bl"></div><div class="card-corner br"></div>
                <h3 data-i18n="result_title">測驗結果</h3>
                <div id="result-summary" class="result-summary"></div>
                <div id="result-detail" class="result-detail"></div>
                <div class="action-buttons">
                    <button class="btn next-btn" onclick="showModeSelection()" data-i18n="quiz_again">&#x2192; 再來一次</button>
                    <button class="btn back-btn" onclick="backToLanguage()" data-i18n="quiz_back">&#x2190; 返回選擇語言</button>
                </div>
            </div>
        </div>

        <div id="page-music" style="display: none;">
            <div class="music-tabs">
                <button class="music-tab active" onclick="switchMusicTab('all', this)" data-i18n="music_all">&#x266B; 所有歌曲</button>
                <button class="music-tab" onclick="switchMusicTab('cn', this)" data-i18n="music_cn">&#x266B; 中文 / 粵語歌</button>
            </div>
            <div class="music-player">
                <iframe id="music-iframe" src="https://open.spotify.com/embed/playlist/0QFBFg35lFuDvuYapAolHC?utm_source=generator&theme=0" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>
        </div>
        <div id="page-osu" style="display: none;">
            <div class="osu-add-card">
                <div class="card-corner tl"></div><div class="card-corner tr"></div>
                <div class="card-corner bl"></div><div class="card-corner br"></div>
                <h3 data-i18n="osu_title">&#x266B; 新增 Beatmap &#x266B;</h3>
                <div class="input-group">
                    <input type="text" id="osuInput" data-i18n-placeholder="osu_placeholder" placeholder="輸入 ID 或貼上 osu! 網址" onkeydown="if(event.key==='Enter')addOsuBeatmap()">
                    <button onclick="addOsuBeatmap()" data-i18n="osu_add">新增</button>
                </div>
                <p id="osu-status" class="status"></p>
                <div class="osu-volume">
                    <span>&#128264;</span>
                    <input type="range" id="osu-volume" min="0" max="1" step="0.05" value="0.4" oninput="osuSetVolume(this.value)">
                    <button class="osu-refresh-all" onclick="refreshAllOsuSets()" title="重新整理所有 Beatmap">&#x21bb;</button>
                </div>
                <div class="osu-io-btns">
                    <button class="osu-io-btn" onclick="exportOsuData()" data-i18n="osu_export">&#x1F4E5; 匯出</button>
                    <button class="osu-io-btn" onclick="document.getElementById('osu-import-file').click()" data-i18n="osu_import">&#x1F4E4; 匯入</button>
                    <button class="osu-io-btn" onclick="setupOsuPassword()" data-i18n="osu_password">&#x1F512; 設定密碼</button>
                    <input type="file" id="osu-import-file" accept=".json" style="display:none" onchange="importOsuData(event)">
                </div>
            </div>

            <div class="osu-mode-tabs">
                <button class="osu-tab" onclick="switchOsuTab('favorites', this)" data-i18n="osu_fav">♥ 最愛</button>
                <button class="osu-tab active" onclick="switchOsuTab('standard', this)">Standard</button>
                <button class="osu-tab" onclick="switchOsuTab('taiko', this)">Taiko</button>
                <button class="osu-tab" onclick="switchOsuTab('catch', this)">Catch</button>
                <button class="osu-tab" onclick="switchOsuTab('mania', this)">Mania</button>
            </div>

            <div id="osu-collection" class="osu-collection"></div>
            <div id="osu-pagination" class="osu-pagination"></div>
        </div>
    </main>

    <footer>
        <div class="footer-sakura">&#x273F;</div>
        <p>2026 hanabirn の 小天地</p>
    </footer>

        let siteLang = localStorage.getItem('site_lang') || 'zh';

        function applyLang(lang) {
            siteLang = lang;
            localStorage.setItem('site_lang', lang);
            const t = I18N[lang] || I18N.zh;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerHTML = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });
            const labels = { zh:'🌐 中文', en:'🌐 English', ja:'🌐 日本語', ko:'🌐 한국어', ru:'🌐 Русский', fr:'🌐 Français', es:'🌐 Español', de:'🌐 Deutsch' };
            document.getElementById('lang-switch-label').innerText = labels[lang] || labels.zh;
        }

        function toggleLangMenu() {
            document.getElementById('lang-switch-menu').classList.toggle('show');
        }

        function setSiteLang(lang) {
            applyLang(lang);
            document.getElementById('lang-switch-menu').classList.remove('show');
        }

            if (!e.target.closest('.lang-switcher')) {
                document.getElementById('lang-switch-menu').classList.remove('show');

        });

        function t(key, params) {
            const str = (I18N[siteLang] || I18N.zh)[key] || (I18N.zh)[key] || key;
            if (!params) return str;
            return Object.entries(params).reduce((s, [k, v]) => s.replace(`{${k}}`, v), str);
        }
        const PLAYLISTS = {

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;

        function playSound(correct) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if (correct) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, ctx.currentTime);
                    osc.frequency.setValueAtTime(659, ctx.currentTime + 0.08);
                    osc.frequency.setValueAtTime(784, ctx.currentTime + 0.16);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.4);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(180, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.35);
                }
            } catch(e) {}
        }

        function speakWord() {
            if (!currentWord || !currentWord.word) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(currentWord.word);
            utter.lang = currentLang === 'jp' ? 'ja-JP' : 'ko-KR';
            utter.rate = 0.8;
            const voices = window.speechSynthesis.getVoices();
            const langPrefix = currentLang === 'jp' ? 'ja' : 'ko';
            const match = voices.find(v => v.lang.startsWith(langPrefix));
            if (match) utter.voice = match;
            window.speechSynthesis.speak(utter);

        function extractSheetId(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : url;
        }

        function isValidWord(word, meaning) {
            if (!word || !meaning) return false;
            const w = word.trim();
            const m = meaning.trim();
            if (w.includes('動畫') || w.includes('動画') || w.includes('동영상') || w.includes('註') || w.includes('★') || w.includes('單字')) return false;
            if (m.includes('動畫') || m.includes('動画') || m.includes('意思') || m.includes('註')) return false;
            if (/^\d+$/.test(w)) return false;
            if (w.length === 0 || m.length === 0) return false;
            return true;
        }

            const sheetId = extractSheetId(url);
            if (!sheetId) {

            statusMsg.style.color = '#c8a2e0';

            Papa.parse(csvUrl, {
                download: true,
                header: false,
                complete: function(results) {

                    vocabularyList = [];
                    readingList = [];

                    if (currentLang === 'jp') {
                        parseJapanese(rows);

                    }

                error: function() {

                    statusMsg.style.color = '#ff5252';
                }

        function parseJapanese(rows) {
            rows.forEach((row, idx) => {
                if (row.length < 6) return;
                if (idx < 5) console.log(`JP row[${idx}] (len=${row.length}):`, row.slice(0, 24));
                addWord(row[2], row[3], row[4], row[5]);
                if (row.length > 8)  addWord(row[8], row[9], row[10], row[11]);
                if (row.length > 14) addWord(row[14], row[15], row[16], row[17]);
                if (row.length > 20) addWord(row[20], row[21], row[22], row[23]);
            });
            console.log('JP parsed vocabularyList sample:', vocabularyList.slice(0, 10));
        }

        function parseKorean(rows) {
            rows.forEach((row, idx) => {
                if (row.length < 6) return;
                if (idx < 5) console.log(`KR row[${idx}] (len=${row.length}):`, row.slice(0, 24));
                addWord(row[2], '', row[3], row[4]);
                if (row.length > 8)  addWord(row[8], '', row[9], row[10]);
                if (row.length > 14) addWord(row[14], '', row[15], row[16]);
                if (row.length > 20) addWord(row[20], '', row[21], row[22]);
            });
            console.log('KR parsed vocabularyList sample:', vocabularyList.slice(0, 10));
        }

        function addWord(word, kana, meaning, englishMeaning) {
            const w = word.trim();
            const k = kana ? kana.trim() : '';
            const m = meaning.trim();

            if (!isValidWord(w, m)) return;
            vocabularyList.push({ word: w, kana: k, meaning: m, english: e });
            if (k.length > 0) {

            }
        }

        function pickQuestionType() {
            if (currentMode === 'meaning') return 'meaning';
            if (currentMode === 'reading') return 'reading';

        function nextQuestion() {
            answered = false;
            questionNum++;
            document.getElementById('question-count').innerText = t('quiz_question', {n: questionNum});
            document.getElementById('score-count').innerText = t('quiz_score', {n: score});
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('feedback').innerText = '';
            document.getElementById('feedback').className = 'feedback';

            const questionType = pickQuestionType();
            const useEn = quizAnswerLang === 'en';

            if (questionType === 'reading' && shuffledReading.length >= 4) {
                if (readingIdx >= shuffledReading.length) shuffledReading = shuffleArray(readingList);
                currentWord = shuffledReading[readingIdx++];

                document.getElementById('word-question').innerText = currentWord.word;
                document.getElementById('word-hint').innerText = useEn
                    ? currentWord.english || currentWord.meaning
                    : currentWord.meaning;

                let options = [currentWord.kana];
                while (options.length < 4) {
                    const pick = shuffledReading[Math.floor(Math.random() * shuffledReading.length)].kana;
                    if (!options.includes(pick)) options.push(pick);
                }
                options.sort(() => Math.random() - 0.5);
                renderOptions(options, 'reading');
            } else {
                if (vocabIdx >= shuffledVocab.length) shuffledVocab = shuffleArray(vocabularyList);
                currentWord = shuffledVocab[vocabIdx++];

                document.getElementById('word-question').innerText = currentWord.word;
                document.getElementById('word-hint').innerText = currentWord.kana ? `讀法：${currentWord.kana}` : '';

                const answerPool = useEn
                    ? shuffledVocab.filter(w => w.english && w.english.length > 0)
                    : shuffledVocab;
                if (answerPool.length < 4) { renderOptions([], 'meaning'); return; }

                const correctAnswer = useEn ? (currentWord.english || currentWord.meaning) : currentWord.meaning;
                let options = [correctAnswer];
                while (options.length < 4) {
                    const pick = answerPool[Math.floor(Math.random() * answerPool.length)];
                    const val = useEn ? (pick.english || pick.meaning) : pick.meaning;
                    if (!options.includes(val)) options.push(val);
                }
                options.sort(() => Math.random() - 0.5);
                renderOptions(options, 'meaning');
            }

            if (autoSpeak && currentWord && currentWord.word) {
                setTimeout(() => speakWord(), 300);
            }
        }

        function selectOption(selectedBtn, selectedText, type) {
            if (answered) return;
            answered = true;

            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.disabled = true);

            const feedback = document.getElementById('feedback');
            const useEn = quizAnswerLang === 'en';
            const correctAnswer = type === 'reading' ? currentWord.kana
                : (useEn ? (currentWord.english || currentWord.meaning) : currentWord.meaning);
            const isCorrect = selectedText === correctAnswer;

            quizHistory.push({
                question: currentWord.word,
                yourAnswer: selectedText,
                correctAnswer: correctAnswer,
                isCorrect: isCorrect,
                type: type
            });

            if (isCorrect) {
                score += 10;
                selectedBtn.classList.add('correct-choice');
                feedback.innerText = t('correct');
                feedback.className = 'feedback correct';
                playSound(true);
            } else {
                score -= 3;
                selectedBtn.classList.add('wrong-choice');
                allBtns.forEach(btn => {
                    if (btn.innerText === correctAnswer) {
                        btn.classList.add('correct-choice');
                    }
                });
                feedback.innerText = t('wrong') + correctAnswer;
                feedback.className = 'feedback wrong';
                playSound(false);
            }

            document.getElementById('score-count').innerText = `${t('quiz_score', {n: score})}`;

            if (totalQuestions > 0 && questionNum >= totalQuestions) {
                document.getElementById('nextBtn').innerText = t('quiz_next');
                document.getElementById('nextBtn').onclick = () => showResults();
            } else {
                document.getElementById('nextBtn').innerText = t('quiz_next');

        async function sha256(str) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
        }

        function parseOsuInput(input) {
            const urlMatch = input.match(/osu\.ppy\.sh\/(?:beatmaps?|beatmapsets?)\/(\d+)/);
            if (urlMatch) return { type: 'url', id: urlMatch[1], isSet: input.includes('beatmapsets') };
            if (/^\d+$/.test(input.trim())) return { type: 'id', id: input.trim(), isSet: false };
            return null;
        }

        async function osuFetch(params) {
            const res = await fetch(`/.netlify/functions/osu?${params}`);
            const text = await res.text();
            try { return JSON.parse(text); }
            catch { throw new Error(`Function 回傳非 JSON (HTTP ${res.status}): ${text.substring(0, 200)}`); }
        }

        async function addOsuBeatmap() {
            if (!await verifyOsuPassword()) return;
            const input = document.getElementById('osuInput');
            const status = document.getElementById('osu-status');
            const raw = input.value.trim();
            if (!raw) return;

            const parsed = parseOsuInput(raw);
            if (!parsed) {
                status.innerText = t('osu_input_error');
                status.style.color = '#ff5252';
                return;
            }

            status.innerText = t('osu_searching');
            status.style.color = '#c8a2e0';

            try {
                let beatmaps = [];

                if (parsed.isSet || parsed.type === 'url' && input.value.includes('beatmapsets')) {
                    beatmaps = await osuFetch(`s=${parsed.id}`);
                }

                if (beatmaps.length === 0) {
                    const byMap = await osuFetch(`b=${parsed.id}`);
                    if (byMap.length > 0) {
                        beatmaps = await osuFetch(`s=${byMap[0].beatmapset_id}`);
                    }
                }

                if (beatmaps.length === 0 && !parsed.isSet) {
                    beatmaps = await osuFetch(`s=${parsed.id}`);
                }

                if (beatmaps.length === 0) {
                    status.innerText = t('osu_not_found');
                    status.style.color = '#ff5252';
                    return;
                }

                const modeNum = parseInt(beatmaps[0].mode);
                const modeKey = OSU_MODE_NAMES[modeNum];
                const col = getOsuCollection();

                const alreadyExists = col[modeKey].some(s => s.beatmapset_id === parseInt(beatmaps[0].beatmapset_id));
                if (alreadyExists) {
                    status.innerText = t('osu_already_exists', { n: `${beatmaps[0].artist} - ${beatmaps[0].title}` });
                    status.style.color = '#f59e0b';
                    return;
                }

                const setInfo = {
                    beatmapset_id: parseInt(beatmaps[0].beatmapset_id),
                    title: beatmaps[0].title,
                    artist: beatmaps[0].artist,
                    creator: beatmaps[0].creator,
                    mode: modeNum,
                    beatmaps: beatmaps.map(b => ({
                        beatmap_id: parseInt(b.beatmap_id),
                        version: b.version,
                        difficulty_rating: parseFloat(b.difficultyrating),
                        hit_length: parseInt(b.hit_length),
                        total_length: parseInt(b.total_length),
                        bpm: parseFloat(b.bpm)
                    })).sort((a, b) => a.difficulty_rating - b.difficulty_rating)
                };

                col[modeKey].unshift(setInfo);
                saveOsuCollection(col);

                const modeNames = { standard: 'Standard', taiko: 'Taiko', catch: 'Catch', mania: 'Mania' };
                status.innerText = t('osu_added', { n: `${setInfo.artist} - ${setInfo.title}`, m: modeNames[modeKey], k: setInfo.beatmaps.length });
                status.style.color = '#34d399';
                input.value = '';

                osuCurrentTab = modeKey;
                document.querySelectorAll('.osu-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.osu-tab')[modeNum + 1].classList.add('active');
                renderOsuCollection();
            } catch (e) {
                console.error('osu! fetch error:', e);
                status.innerText = `連線失敗: ${e.message}`;
                status.style.color = '#ff5252';
            }
        }

        function switchOsuTab(mode, btn) {
            document.querySelectorAll('.osu-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            osuCurrentTab = mode;
            osuPage = 0;
            renderOsuCollection();
        }

        async function removeOsuSet(setId) {
            if (!await verifyOsuPassword()) return;
            const col = getOsuCollection();
            col[osuCurrentTab] = col[osuCurrentTab].filter(s => s.beatmapset_id !== setId);
            saveOsuCollection(col);
            renderOsuCollection();
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        async function refreshAllOsuSets() {
            if (!await verifyOsuPassword()) return;
            const btn = document.querySelector('.osu-refresh-all');
            const status = document.getElementById('osu-status');
            btn.classList.add('spinning');
            status.innerText = t('osu_refreshing');
            status.style.color = '#c8a2e0';

            const col = getOsuCollection();
            const allIds = new Set();
            for (const mode of OSU_MODES) {
                for (const s of col[mode]) allIds.add(s.beatmapset_id);
            }

            try {
                for (const setId of allIds) {
                    const beatmaps = await osuFetch(`s=${setId}`);
                    if (beatmaps.length === 0) continue;
                    for (const mode of OSU_MODES) {
                        const idx = col[mode].findIndex(s => s.beatmapset_id === setId);
                        if (idx >= 0) {
                            col[mode][idx].beatmaps = beatmaps.map(b => ({
                                beatmap_id: parseInt(b.beatmap_id),
                                version: b.version,
                                difficulty_rating: parseFloat(b.difficultyrating),
                                hit_length: parseInt(b.hit_length),
                                total_length: parseInt(b.total_length),
                                bpm: parseFloat(b.bpm)
                            })).sort((a, b) => a.difficulty_rating - b.difficulty_rating);
                            break;
                        }
                    }
                }
                saveOsuCollection(col);
                renderOsuCollection();
                status.innerText = t('osu_refresh_done', { n: allIds.size });
                status.style.color = '#34d399';
            } catch (e) {
                console.error('Refresh all failed:', e);
                status.innerText = t('osu_refresh_fail');
                status.style.color = '#ff5252';
            } finally {
                btn.classList.remove('spinning');
            }
        }

        function renderOsuCollection() {
            const container = document.getElementById('osu-collection');
            const paginationEl = document.getElementById('osu-pagination');
            const col = getOsuCollection();
            let sets;

            if (osuCurrentTab === 'favorites') {
                const favIds = getOsuFavorites();
                const allSets = [...col.standard, ...col.taiko, ...col.catch, ...col.mania];
                const seen = new Set();
                sets = allSets.filter(s => {
                    if (favIds.includes(s.beatmapset_id) && !seen.has(s.beatmapset_id)) {
                        seen.add(s.beatmapset_id);
                        return true;
                    }
                    return false;
                });
            } else {
                const seen = new Set();
                sets = col[osuCurrentTab].filter(s => {
                    if (seen.has(s.beatmapset_id)) return false;
                    seen.add(s.beatmapset_id);
                    return true;
                });
            }

            if (sets.length === 0) {
                const msg = osuCurrentTab === 'favorites'
                    ? `${t('osu_empty_fav')}<br><span>${t('osu_empty_fav_hint')}</span>`
                    : `${t('osu_empty_collection')}<br><span>${t('osu_empty_hint')}</span>`;
                container.innerHTML = `<div class="osu-empty">${msg}</div>`;
                paginationEl.innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(sets.length / OSU_PAGE_SIZE);
            if (osuPage >= totalPages) osuPage = totalPages - 1;
            if (osuPage < 0) osuPage = 0;
            const pageSets = sets.slice(osuPage * OSU_PAGE_SIZE, (osuPage + 1) * OSU_PAGE_SIZE);

            container.innerHTML = pageSets.map(set => {
                const coverUrl = `https://assets.ppy.sh/beatmaps/${set.beatmapset_id}/covers/card.jpg`;
                const isFav = isOsuFavorited(set.beatmapset_id);
                const starsMin = Math.min(...set.beatmaps.map(b => b.difficulty_rating));
                const starsMax = Math.max(...set.beatmaps.map(b => b.difficulty_rating));
                const starsText = (starsMin === 0 && starsMax === 0) ? '' : `<div class="osu-card-stars">${starsMin.toFixed(2)}⭐~${starsMax.toFixed(2)}⭐</div>`;
                return `
                <div class="osu-card" onclick="window.open('https://osu.ppy.sh/beatmapsets/${set.beatmapset_id}','_blank')">
                    <div class="osu-card-bg" style="background-image:url('${coverUrl}')"></div>
                    <div class="osu-card-overlay"></div>
                    <button class="osu-copy-btn" onclick="copyBeatmapId(${set.beatmapset_id}, event)" title="複製 ID">📋</button>
                    <button class="osu-play-btn" onclick="playOsuPreview(${set.beatmapset_id}, event)" title="播放預覽">&#9654;</button>
                    <button class="osu-fav-btn ${isFav ? 'active' : ''}" onclick="toggleOsuFavorite(${set.beatmapset_id}, event)" title="${isFav ? '取消最愛' : '加入最愛'}">♥</button>
                    <button class="osu-delete-btn" onclick="event.stopPropagation();removeOsuSet(${set.beatmapset_id})" title="移除">&#x2715;</button>
                    <div class="osu-card-info">
                        <div class="osu-card-title">${set.title}</div>
                        ${starsText}
                        <div class="osu-card-artist">${set.artist}</div>
                        <div class="osu-card-mapper">${t('mapped_by', { n: set.creator })}</div>
                    </div>
                </div>`;
            }).join('');

            if (totalPages <= 1) {
                paginationEl.innerHTML = '';
            } else {
                let pages = '';
                pages += `<button class="osu-page-btn" onclick="osuPage=0;renderOsuCollection()" ${osuPage===0?'disabled':''}>«</button>`;
                pages += `<button class="osu-page-btn" onclick="osuPage=Math.max(0,osuPage-1);renderOsuCollection()" ${osuPage===0?'disabled':''}>‹</button>`;
                for (let i = 0; i < totalPages; i++) {
                    pages += `<button class="osu-page-btn ${i===osuPage?'active':''}" onclick="osuPage=${i};renderOsuCollection()">${i+1}</button>`;
                }
                pages += `<button class="osu-page-btn" onclick="osuPage=Math.min(${totalPages-1},osuPage+1);renderOsuCollection()" ${osuPage>=totalPages-1?'disabled':''}>›</button>`;
                pages += `<button class="osu-page-btn" onclick="osuPage=${totalPages-1};renderOsuCollection()" ${osuPage>=totalPages-1?'disabled':''}>»</button>`;
                paginationEl.innerHTML = pages;
            }
        }
        applyLang(siteLang);
    </script>
</body>
</html>
